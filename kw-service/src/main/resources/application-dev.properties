# datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electricity}
spring.datasource.username=${DB_USER:academy}
spring.datasource.password=${DB_PASSWORD:academy}
# logging
logging.level.root=INFO
logging.level.fi.william.kwservice=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
# kilowatch
kilowatch.cors.allowed-origins=http://localhost:3333
kilowatch.day-details.cheapest-hours-count=3
kilowatch.day-details.peak-hours-count=3
kilowatch.day-details.scale-multiplier=1000