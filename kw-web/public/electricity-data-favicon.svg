<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Electricity data chart icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>

  <!-- Chart bars -->
  <rect x="14" y="37" width="6" height="11" rx="2" fill="#433f3a"/>
  <rect x="24" y="31" width="6" height="17" rx="2" fill="#433f3a"/>
  <rect x="34" y="25" width="6" height="23" rx="2" fill="#433f3a"/>
  <rect x="44" y="20" width="6" height="28" rx="2" fill="#433f3a"/>

  <!-- Electricity-inspired chart line -->
  <path d="M14 35 L25 30 L30 31 L35 24 L39 27 L48 17"
        fill="none"
        stroke="#fdc700"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
