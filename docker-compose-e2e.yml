services:
  database:
    container_name: kw-e2e-database
    build:
      context: ./database/
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: electricity
    healthcheck:
      test: "pg_isready -U academy -d electricity"
      interval: 5s
      timeout: 5s
      retries: 5

  service:
    container_name: kw-e2e-service
    build:
      context: ./kw-service/
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: electricity
      DB_USER: academy
      DB_PASSWORD: academy
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: "curl -f http://localhost:8888/health || exit 1"
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    container_name: kw-e2e-web
    build:
      context: ./kw-web/
      dockerfile: Dockerfile
    ports:
      - "3333:80"
    depends_on:
      service:
        condition: service_healthy