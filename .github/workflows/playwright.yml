name: Playwright Tests
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: kw-web/.nvmrc
          cache: npm
          cache-dependency-path: kw-web/package-lock.json

      - name: Install dependencies
        working-directory: kw-web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: kw-web
        run: npx playwright install --with-deps

      - name: Start the composed stack
        run: docker compose -f docker-compose-e2e.yml up --build -d --wait

      - name: Run Playwright tests
        working-directory: kw-web
        env:
          E2E_BASE_URL: http://localhost:3333
          E2E_COMPOSE: 1
        run: npx playwright test

      - name: Print container logs on failure
        if: failure()
        run: docker compose -f docker-compose-e2e.yml logs

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose-e2e.yml down -v

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kw-web/playwright-report/
          retention-days: 30
